[project]
name = "athletic-warehouse"
version = "0.1.0"
description = "Athletic Warehouse Sports Analytics & Data Platform"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "chdb>=2.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv.workspace]
members = [
    "warehouse-backend",
]
