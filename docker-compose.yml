services:
  # ClickHouse OLAP Data Warehouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: athletic-clickhouse
    ports:
      - "8123:8123" # HTTP API
      - "9000:9000" # Native Client
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-athletic_warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infra/clickhouse/seeds/02_fixtures.sql:/docker-entrypoint-initdb.d/02_fixtures.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak IAM & RBAC
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: athletic-keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sports-club}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # Athletic Warehouse Backend & Ingestion API
  warehouse-backend:
    build:
      context: ./warehouse-backend
      dockerfile: Dockerfile
    container_name: athletic-warehouse-backend
    ports:
      - "8000:8000"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-athletic_warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-sports-club}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-warehouse-backend-api}
      TABLEFLOW_WEBHOOK_SECRET: ${TABLEFLOW_WEBHOOK_SECRET:-tableflow-webhook-dev-secret}
    depends_on:
      clickhouse:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Metabase Business Intelligence
  metabase:
    image: metabase/metabase:latest
    container_name: athletic-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy

  # Tableflow CSV/Excel Ingestion Engine
  tableflow:
    image: tableflow/tableflow:latest
    container_name: athletic-tableflow
    ports:
      - "3001:3001"
    environment:
      TABLEFLOW_WEBHOOK_URL: http://warehouse-backend:8000/api/v1/ingest/tableflow
    depends_on:
      - warehouse-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  clickhouse_data:
  keycloak_data:
  metabase_data:
