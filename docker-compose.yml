services:
  # ClickHouse OLAP Data Warehouse
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: athletic-clickhouse
    ports:
      - "8123:8123" # HTTP API
      - "9000:9000" # Native Client
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-athletic_warehouse}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./infra/clickhouse/seeds/02_fixtures.sql:/docker-entrypoint-initdb.d/02_fixtures.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak IAM & RBAC
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: athletic-keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_password}
    volumes:
      - keycloak_data:/opt/keycloak/data

  # Metabase Business Intelligence
  metabase:
    image: metabase/metabase:latest
    container_name: athletic-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      clickhouse:
        condition: service_healthy

  # Tableflow CSV/Excel Ingestion Engine
  tableflow:
    image: tableflow/tableflow:latest
    container_name: athletic-tableflow
    ports:
      - "3001:3001"
    environment:
      TABLEFLOW_WEBHOOK_URL: http://warehouse-backend:8000/api/v1/ingest/tableflow
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  clickhouse_data:
  keycloak_data:
  metabase_data:
